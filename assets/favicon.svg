<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="neoma-petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7597"/>
      <stop offset="100%" stop-color="#E85D8A"/>
    </linearGradient>
    <linearGradient id="neoma-bulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background for perfect contrast on dark & light browser tabs -->
  <circle cx="16" cy="16" r="15" fill="#2A1420" stroke="#FF7597" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Sakura Petals (5-fold rotation) -->
  <g transform="translate(16 16)" filter="url(#glow)">
    <!-- Base Petal: starts at top (0, -11), curves to center (0, 0) -->
    <path d="M0 -11 C1.2 -5.5 4.5 -3 0 0 C-4.5 -3 -1.2 -5.5 0 -11 Z" fill="url(#neoma-petal)"/>
    <path d="M0 -11 C1.2 -5.5 4.5 -3 0 0 C-4.5 -3 -1.2 -5.5 0 -11 Z" fill="url(#neoma-petal)" transform="rotate(72)"/>
    <path d="M0 -11 C1.2 -5.5 4.5 -3 0 0 C-4.5 -3 -1.2 -5.5 0 -11 Z" fill="url(#neoma-petal)" transform="rotate(144)"/>
    <path d="M0 -11 C1.2 -5.5 4.5 -3 0 0 C-4.5 -3 -1.2 -5.5 0 -11 Z" fill="url(#neoma-petal)" transform="rotate(216)"/>
    <path d="M0 -11 C1.2 -5.5 4.5 -3 0 0 C-4.5 -3 -1.2 -5.5 0 -11 Z" fill="url(#neoma-petal)" transform="rotate(288)"/>

    <!-- Projector Bulb Center -->
    <circle cx="0" cy="0" r="3.2" fill="url(#neoma-bulb)"/>
    <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
